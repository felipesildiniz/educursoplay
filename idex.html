<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>ENEM Play — Cursos em vídeo para o ENEM</title>
<meta name="description" content="Aulas em vídeo de todas as matérias do ENEM. Assista em sequência, acompanhe seu progresso e estude no seu ritmo.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234f46e5'/><path d='M40 30l28 20-28 20z' fill='white'/></svg>">
</head>
<body>

<!-- ======================= TOPO ======================= -->
<header class="topbar">
  <div class="container topbar__inner">
    <a href="#/" class="brand" aria-label="ENEM Play — início">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M8 5.5v13l11-6.5-11-6.5z" fill="currentColor"/></svg>
      </span>
      <span class="brand__text">ENEM<strong>Play</strong></span>
    </a>

    <nav class="nav" aria-label="Navegação principal">
      <a href="#/" data-rota="">Início</a>
      <a href="#/cursos" data-rota="cursos">Cursos</a>
      <a href="#/ajuda" data-rota="ajuda">Como usar</a>
    </nav>

    <div class="topbar__acoes">
      <form class="busca" id="form-busca" role="search">
        <svg class="busca__ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="search" id="campo-busca" placeholder="Buscar aula ou matéria…" autocomplete="off" aria-label="Buscar aula ou matéria">
      </form>

      <button class="icone-btn" id="btn-tema" type="button" aria-label="Alternar tema claro/escuro" title="Alternar tema">
        <svg class="ico-sol" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="2"/>
          <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <svg class="ico-lua" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<!-- ======================= CONTEÚDO ======================= -->
<main id="app" tabindex="-1"></main>

<!-- ======================= RODAPÉ ======================= -->
<footer class="rodape">
  <div class="container rodape__inner">
    <div class="rodape__marca">
      <a href="#/" class="brand brand--pequena">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M8 5.5v13l11-6.5-11-6.5z" fill="currentColor"/></svg>
        </span>
        <span class="brand__text">ENEM<strong>Play</strong></span>
      </a>
      <p>Aulas em vídeo de todas as matérias do ENEM.<br>Estude no seu ritmo, de onde quiser.</p>
    </div>

    <div class="rodape__cols">
      <div>
        <h4>Matérias</h4>
        <ul id="rodape-cursos"></ul>
      </div>
      <div>
        <h4>Ajuda</h4>
        <ul>
          <li><a href="#/ajuda">Como adicionar aulas</a></li>
          <li><a href="#/cursos">Todos os cursos</a></li>
          <li><a href="#/ajuda">Links suportados</a></li>
        </ul>
      </div>
    </div>
  </div>
  <div class="container rodape__base">
    <span>© <span id="ano"></span> ENEM Play — material de estudos.</span>
    <span class="rodape__dica">Seu progresso fica salvo neste navegador.</span>
  </div>
</footer>

<script src="dados.js"></script>
<script src="app.js"></script>
</body>
</html>
